<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flynemoo - عروض الرحلات</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'brand-orange': '#f97316',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="p-5 border-b border-slate-800 bg-slate-950/50 backdrop-blur sticky top-0 z-50">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-black text-brand-orange tracking-wider">FLYNEMOO</h1>
      <span class="text-xs bg-slate-800 text-slate-300 px-3 py-1 rounded-full border border-slate-700">لوحة التحكم نشطة</span>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-4xl mx-auto w-full p-4 flex-grow">
    
    <!-- Section: Offers Display -->
    <section class="my-6">
      <h2 class="text-xl font-bold text-slate-100 mb-4 border-r-4 border-brand-orange pr-3">أحدث عروض الرحلات</h2>
      
      <!-- Container where Pages CMS offers will automatically render -->
      <div id="offers-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Placeholder while loading or if no data exists -->
        <div class="col-span-full bg-slate-800/50 border border-slate-700/50 rounded-2xl p-6 text-center text-slate-400">
          جاري تحميل العروض الحالية...
        </div>
      </div>
    </section>

  </main>

  <!-- Script Area -->
  <script>
    // ChatBot Messaging Function
    function sendMessage() {
      const input = document.getElementById('chat-input');
      const messages = document.getElementById('chat-messages');
      if (!input || !messages) return;
      
      const txt = input.value.trim();
      if (!txt) return;

      // User Message UI
      messages.innerHTML += `<div class="bg-brand-orange/20 border border-brand-orange/40 p-3 rounded-2xl rounded-tl-none text-white my-2">${txt}</div>`;
      input.value = '';

      // Bot Auto Reply Logic
      setTimeout(() => {
        let reply = "أهلاً بك! يمكنك التواصل مباشرة مع خدمة العملاء على 01006162892 أو عبر واتساب للحصول على تفاصيل أسرع.";
        if (txt.includes("سعر") || txt.includes("عروض") || txt.includes("price")) {
          reply = "عروضنا تبدأ من 4,300 جنيه لشرم الشيخ والبحر الأحمر مع كامل الوجبات!";
        } else if (txt.includes("مكان") || txt.includes("عنوان") || txt.includes("location")) {
          reply = "فرعنا في الإسكندرية: 78 شارع عبد السلام عارف، بجوار مستشفى إبراهيم عبيده، سابا باشا.";
        }
        messages.innerHTML += `<div class="bg-slate-800 p-3 rounded-2xl rounded-tr-none text-slate-200 max-w-[85%] my-2">${reply}</div>`;
        messages.scrollTop = messages.scrollHeight;
      }, 600);
    }

    // Fetch & Display Offers from Pages CMS JSON
    async function loadOffers() {
      const container = document.getElementById('offers-container');
      if (!container) return;

      try {
        const response = await fetch('./content/offers.json');
        if (!response.ok) throw new Error("No data found");
        
        const offers = await response.json();
        
        // Render Offers if array has items
        if (Array.isArray(offers) && offers.length > 0) {
          container.innerHTML = offers.map(offer => `
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-lg text-white flex flex-col justify-between hover:border-slate-600 transition">
              <div>
                ${offer.image ? `<img src="${offer.image}" alt="${offer.title}" class="w-full h-48 object-cover rounded-xl mb-4">` : ''}
                <h3 class="text-xl font-bold text-brand-orange mb-2">${offer.title}</h3>
                <p class="text-green-400 font-bold text-lg mb-2">${offer.price} جنيه</p>
                <p class="text-slate-300 text-sm leading-relaxed">${offer.desc}</p>
              </div>
            </div>
          `).join('');
        } else {
          container.innerHTML = `
            <div class="col-span-full bg-slate-800/50 border border-slate-700/50 rounded-2xl p-6 text-center text-slate-400">
              لا توجد عروض مسجلة حالياً. استخدم لوحة التحكم لإضافة عرض جديد.
            </div>`;
        }
      } catch (error) {
        container.innerHTML = `
          <div class="col-span-full bg-slate-800/50 border border-slate-700/50 rounded-2xl p-6 text-center text-slate-400">
            أضف أول عرض لك من لوحة التحكم Pages CMS لتراه هنا فوراً!
          </div>`;
      }
    }

    // Execute on page load
    loadOffers();
  </script>
</body>
</html>
